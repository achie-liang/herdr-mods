<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>连接 Herdr Review</title><link rel="stylesheet" href="pairing.css"></head>
<body><main class="card">
  <div class="brand"><img src="icons/icon48.png" alt=""><span>HERDR UI REVIEW</span></div>
  <h1>连接你的工作区</h1>
  <p class="subtitle">在 Herdr 的 Review 面板点击「连接」，然后输入一次性配对码。连接一次，之后自动识别。</p>
  <form id="pair-form">
    <label for="code">配对码 <span>5 分钟内有效</span></label>
    <input id="code" autocomplete="off" spellcheck="false" autocapitalize="characters" maxlength="19" placeholder="ABCD EF01 2345 6789" aria-describedby="status" required>
    <button id="connect" class="primary" type="submit">连接 Herdr</button>
  </form>
  <div id="status" class="status" role="status" aria-live="polite">正在检查连接…</div>
  <div id="connected-actions" hidden><button id="forget" class="quiet" type="button">清除本插件的配对</button></div>
  <section id="forget-confirm" class="confirm" hidden><p>清除后需要重新输入配对码。服务器授权不会撤销；如需撤销，请在 Herdr 中操作。</p><div class="actions"><button id="forget-cancel" type="button">取消</button><button id="forget-allow" class="danger" type="button">确认清除</button></div></section>
  <footer><span class="dot"></span>网页只暂存标注，执行仍需在 Herdr 中确认。</footer>
</main><script src="pairing.js"></script></body></html>
